# Builds the site as a static export and publishes it to GitHub Pages
# on every push to main. Enable once: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # e.g. "/dj-tamiko-site" (empty for a <user>.github.io repo)
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Public URL — enables indexing, canonical URLs and the sitemap.
          # Replace with the custom domain once one is connected.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Fix segment prefetch file names
        run: node scripts/flatten-segment-prefetch.mjs out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
